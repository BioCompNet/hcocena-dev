name: R-CMD-check

on:
  push:
    branches:
      - main
      - devel
  pull_request:

permissions:
  contents: read

jobs:
  R-CMD-check:
    # Development happens on Windows while Bioconductor builds
    # on Linux, so both are checked.
    runs-on: ${{ matrix.config.os }}
    name: R-CMD-check (${{ matrix.config.os }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest }
          - { os: windows-latest }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          # The package currently checks clean, so keep it that way: a new
          # warning should fail the build rather than accumulate quietly.
          error-on: '"warning"'

  bioc-devel:
    # New packages are reviewed against Bioconductor devel, which runs on a
    # newer R than the release jobs above. The official devel image carries
    # the matching R and Bioconductor versions.
    runs-on: ubuntu-latest
    name: R CMD check + BiocCheck (Bioconductor devel)
    container: bioconductor/bioconductor_docker:devel

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # A Suggests package that currently fails to build on Bioconductor devel
      # is missing from the devel repository until it is fixed upstream (in
      # September 2026: decoupleR and dorothea, whose vignettes download from
      # an unavailable server). hcocena only uses its Suggests conditionally,
      # so check without them instead of failing on someone else's build.
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v4

      - name: Use the Bioconductor build machines' R settings
        run: |
          curl -fsSL https://bioconductor.org/checkResults/devel/bioc-LATEST/Renviron.bioc \
            -o "$HOME/.Renviron.bioc"
          echo "R_ENVIRON_USER=$HOME/.Renviron.bioc" >> "$GITHUB_ENV"
        shell: bash

      - name: Install dependencies
        run: |
          Rscript -e 'BiocManager::install(c("remotes", "rcmdcheck", "BiocCheck"), ask = FALSE, update = FALSE)'
          Rscript -e 'remotes::install_deps(".", dependencies = TRUE, repos = BiocManager::repositories(), upgrade = "never")'
        shell: bash

      - name: Session info
        run: |
          Rscript -e 'sessionInfo(); BiocManager::version()'
          Rscript -e 'sug <- c("decoupleR", "dorothea", "progeny", "limma", "RCy3", "ellmer"); print(setNames(vapply(sug, requireNamespace, logical(1), quietly = TRUE), sug))'
        shell: bash

      # Same options as the Bioconductor single package builder: no
      # --as-cran, which adds CRAN-only checks (e.g. it flags `BiocType`).
      - name: R CMD check
        run: |
          Rscript -e 'res <- rcmdcheck::rcmdcheck(args = "--no-manual", build_args = "--no-manual", error_on = "warning", check_dir = "check")'
        shell: bash

      - name: BiocCheck
        run: |
          tarball=$(ls -1 check/hcocena_*.tar.gz 2>/dev/null | head -n 1)
          if [ -z "$tarball" ]; then R CMD build --no-manual . && tarball=$(ls -1 hcocena_*.tar.gz | head -n 1); fi
          Rscript -e "res <- BiocCheck::BiocCheck('${tarball}', \`new-package\` = TRUE); \
            n_err <- length(res[['error']]); n_warn <- length(res[['warning']]); \
            cat(sprintf('BiocCheck: %d ERRORS, %d WARNINGS, %d NOTES\n', \
              n_err, n_warn, length(res[['note']]))); \
            if (n_err > 0 || n_warn > 0) quit(status = 1)"
        shell: bash

  BiocCheck:
    # Bioconductor's own checks, which R CMD check does not cover.
    runs-on: ubuntu-latest
    name: BiocCheck

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            bioc::BiocCheck
          needs: check

      - name: Build the source tarball
        run: R CMD build --no-build-vignettes .
        shell: bash

      - name: Run BiocCheck
        run: |
          tarball=$(ls -1 hcocena_*.tar.gz | head -n 1)
          Rscript -e "res <- BiocCheck::BiocCheck('${tarball}'); \
            n_err <- length(res[['error']]); n_warn <- length(res[['warning']]); \
            cat(sprintf('BiocCheck: %d ERRORS, %d WARNINGS, %d NOTES\n', \
              n_err, n_warn, length(res[['note']]))); \
            if (n_err > 0 || n_warn > 0) quit(status = 1)"
        shell: bash
